x solid var(--teal);padding:15px 17px}.option input{margin-top:6px;accent-color:var(--teal);width:17px;height:17px;flex-shrink:0}.letter{font-size:13px;font-weight:800;color:var(--muted);padding-top:3px}.option-text{flex:1}.bottom{margin-top:26px;padding-top:23px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.btn{border:1px solid var(--line);border-radius:9px;padding:11px 19px;background:white;font-weight:650;color:var(--navy)}.btn:hover{background:#edf3f0}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#066459}.btn:disabled{opacity:.4;cursor:not-allowed}.aside-title{font-size:16px;margin:0 0 15px}.side{padding:23px}.progress{height:7px;background:#e6ece8;border-radius:9px;overflow:hidden;margin:14px 0 20px}.progress div{height:100%;background:var(--teal);transition:width .2s}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.navq{min-height:42px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--navy);font-weight:650}.navq.done{background:#e0f2e9;color:#086555;border-color:#b6d9ca}.navq[aria-current=true]{outline:2px solid var(--teal);outline-offset:2px}.micro{font-size:13px;color:var(--muted);margin-top:15px}.side .btn{width:100%;margin-top:16px}.error{color:var(--orange);font-size:14px;margin:15px 0 0}details{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}summary{font-weight:650;cursor:pointer}details>div{padding-top:15px;color:var(--muted);font-size:15px}.data{margin:0 0 24px}.data h2{margin-bottom:12px}.data h3{font-size:19px;margin:0 0 12px}.data p{font-size:15px;color:var(--muted)}.tablewrap{overflow-x:auto;margin:15px 0}table{border-collapse:collapse;min-width:620px;width:100%;font-size:13px}caption{text-align:left;font-weight:700;margin-bottom:8px}th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap}th:first-child{text-align:left}thead{background:#edf2ef}footer{border-top:1px solid var(--line);margin-top:38px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted)}.results-head{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.score{font-size:56px;font-weight:800;letter-spacing:-.05em;color:var(--teal)}.score small{font-size:25px;color:var(--muted)}.review{margin:16px 0}.review h3{font-size:19px;margin:0 0 15px}.tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:9px}.tag.wrong{color:var(--orange)}.answer-line{font-size:15px;margin-bottom:9px}.explain{border-top:1px solid var(--line);padding-top:15px;margin-top:15px;color:var(--muted);font-size:16px}.result-actions{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{order:2}.grid{grid-template-columns:repeat(7,1fr)}header{padding:18px 22px}.header-note{font-size:12px}main{padding-top:27px}.card{padding:23px}.qtop{margin-bottom:15px}h2{font-size:21px}footer{display:block}.score{font-size:48px}}@media(max-width:440px){main{padding-left:16px;padding-right:16px}.card{padding:19px}.option{padding:13px 12px;gap:10px}.option:has(input:checked){padding:12px 11px}.btn{padding:10px 13px}.grid{gap:7px}.bottom{gap:7px}}@media print{header,.intro,.aside,.data,.result-actions,footer{display:none}.card{box-shadow:none;break-inside:avoid}.results-head{display:block}main{padding:0}.review{border-radius:0}}
</style></head><body><header><div class="brand"><span>σ</span><span style="color:#c7d8dc;font-weight:400;margin-left:10px">Statistiques · QCM 3</span></div><div class="header-note">Master 2 NCC</div></header><main><div id="quiz" class="layout"><div><section class="data card" aria-label="Énoncé et données"><h2 id="statement-title" tabindex="-1">Énoncé</h2><p id="case-summary"></p><div id="case-data"></div></section><section id="question-card" class="card" aria-labelledby="question-title"></section></div><aside class="aside"><section class="card side"><h2 class="aside-title">Votre progression</h2><div id="answered" aria-live="polite"></div><div class="progress" role="progressbar" aria-label="Questions répondues" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div id="bar"></div></div><nav class="grid" id="question-nav" aria-label="Navigation entre les questions"></nav><p class="micro">Vous pouvez passer une question ou choisir « Je ne sais pas ». Une réponse absente vaut 0 point. Vous pouvez modifier vos choix avant l’envoi.</p><button id="finish" class="btn primary">Terminer et envoyer mes réponses</button><p id="message" class="error" role="status"></p></section></aside></div><section id="results" class="hidden" aria-labelledby="results-title"></section></main><script>
const questions=[{"id": 1, "exercise": 1, "theme": "Variables indépendantes", "question": "La(les) variable(s) indépendante(s) est(sont)", "options": ["L’âge.", "Le seuil de sensibilité au froid.", "L’âge et la région cutanée stimulée.", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Les facteurs étudiés sont le groupe de participants et la région cutanée (main ou visage). La proposition C désigne le facteur âge chez les patients ; le facteur inter-sujets complet comporte trois groupes : sujets sains, patients de moins de 60 ans et patients de plus de 60 ans."}, {"id": 2, "exercise": 1, "theme": "Variable dépendante", "question": "La variable dépendante est", "options": ["Le seuil de sensibilité au froid.", "La région cutanée stimulée.", "L’âge et la région cutanée stimulée.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "La mesure recueillie est le seuil de perception du froid, exprimé en différence de température par rapport à la peau, en °C. Il s’agit de la variable dépendante."}, {"id": 3, "exercise": 1, "theme": "Plan expérimental", "question": "Le plan d’expérience est", "options": ["à mesures répétées.", "à mesures indépendantes.", "mixte.", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Les trois groupes sont indépendants, tandis que la main et le visage sont mesurés chez les mêmes personnes. Le plan combine donc un facteur inter-sujets et un facteur à mesures répétées : il est mixte."}, {"id": 4, "exercise": 1, "theme": "Loi de référence", "question": "Pour la comparaison des groupes expérimentaux la distribution d'échantillonnage utilisée sous l'hypothèse nulle est", "options": ["la distribution du rapport de deux variances.", "la distribution de la moyenne des différences.", "la distribution de la différence de deux proportions.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "L’ANOVA compare le carré moyen de l’effet des groupes au carré moyen d’erreur inter-sujets. Sous l’hypothèse nulle et les conditions du modèle, leur rapport suit une loi F de Fisher, ici à 2 et 12 degrés de liberté."}, {"id": 5, "exercise": 1, "theme": "Somme des carrés", "question": "Pour la comparaison des groupes, la somme des carrées d’erreur égale à", "options": ["0.52", "0.07", "0.16", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Pour l’effet des groupes, l’erreur correspond aux différences entre sujets d’un même groupe, après moyenne sur les deux régions. SC erreur = 2 × Σ(moyenne du sujet − moyenne de son groupe)² = 0,066, soit environ 0,07."}, {"id": 6, "exercise": 1, "theme": "Effet des groupes", "question": "La probabilité de la statistique de test utilisée pour tester l’effet des groupes est", "options": ["inférieure à 0.05.", "supérieure à 0.05.", "comprise entre 0.05 et 0.1.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "SC groupes = 1,16867 et SC erreur inter-sujets = 0,066. F(2,12) = (1,16867 / 2) / (0,066 / 12) ≈ 106,24. L’effet global des groupes est significatif : p < 0,05."}, {"id": 7, "exercise": 1, "theme": "Effets et interaction", "question": "L’analyse de l’ensemble des facteurs montre", "options": ["Un effet significatif de la zone cutanée stimulée.", "Une interaction non significative entre les groupes expérimentaux et la région cutanée stimulée.", "Une absence d’effet des groupes expérimentaux.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "L’effet de la région est significatif : F(1,12) ≈ 223,13. L’effet des groupes est également significatif et l’interaction groupes × région l’est aussi : F(2,12) ≈ 19,13. Seule la proposition A convient."}, {"id": 8, "exercise": 1, "theme": "Tukey", "question": "Les tests post hoc de Tukey révèlent que", "options": ["Les sujets sains ont des seuils significativement supérieurs à tous les patients.", "Les patients plus âgés ont des seuils significativement plus élevés que les patients moins âgés pour toutes les zones cutanées.", "Les sujets sains ont des seuils significativement plus bas sur le dos de la main que les patients les plus âgés.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Pour les comparaisons globales des groupes, les moyennes sur les deux régions sont −0,28 °C (sains), −0,47 °C (patients < 60 ans) et −0,76 °C (patients > 60 ans). Les écarts dépassent le seuil de Tukey à 5 %. Les valeurs signées des sujets sains sont donc supérieures, c’est-à-dire moins négatives. Une valeur plus négative correspond à un refroidissement plus important pour percevoir le froid."}, {"id": 9, "exercise": 1, "theme": "Intensité des effets", "question": "L'analyse des intensités d'effets montre que", "options": ["La région cutanée stimulée explique la plus grande part de variance.", "Les groupes expérimentaux expliquent la plus grande part de variance.", "L'interaction entre les VI explique la plus grande part de variance.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Les sommes des carrés des effets sont 2,64033 pour la région, 1,16867 pour les groupes et 0,45267 pour l’interaction. Rapportée à la même variance totale, la région cutanée explique la plus grande part."}, {"id": 10, "exercise": 1, "theme": "Conditions d’application", "question": "La vérification des conditions d'application des tests montre que", "options": ["Les variances ne diffèrent pas entre les groupes.", "Les variances diffèrent entre les groupes pour les stimulations sur le visage.", "Les variances diffèrent entre les groupes pour les stimulations sur la main.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Les variances observées sur la main sont 0,007, 0,007 et 0,025 ; sur le visage, 0,003, 0,003 et 0,007. Les tests usuels d’homogénéité ne mettent pas en évidence de différence significative au seuil de 5 %. Cela ne démontre pas une égalité exacte des variances."}, {"id": 11, "exercise": 2, "theme": "Intervalle de confiance", "question": "Les limites de confiance à 95% de la glycémie moyenne des patients sont", "options": ["-1.5 et +1.5", "1.28 et 1.84", "1.5 et 1.7", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "La glycémie moyenne vaut 1,56 g/l, son écart-type d’échantillon 0,3864 g/l, et n = 10. L’intervalle à 95 % est 1,56 ± t(0,975 ; 9) × 0,3864 / √10, soit environ [1,28 ; 1,84] g/l."}, {"id": 12, "exercise": 2, "theme": "Test t", "question": "La statistique permettant de tester une différence entre la glycémie moyenne des patient et la glycémie normale (i.e., 1g/l) est égale à", "options": ["2.1", "1.5", "4.6", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Le test t à un échantillon donne t = (1,56 − 1) / (0,3864 / √10) ≈ 4,58, soit 4,6, avec 9 degrés de liberté."}, {"id": 13, "exercise": 2, "theme": "Corrélation", "question": "Le coefficient de corrélation entre la glycémie et le seuil de sensibilité au froid est", "options": ["0.96", "0.98", "-0.98", "Aucune des réponses ci-dessus ne convient."], "answer": 2, "explanation": "Le coefficient de Pearson calculé sur les dix paires vaut r ≈ −0,98046. Le lien linéaire est fortement négatif : quand la glycémie augmente, le seuil signé devient plus négatif."}, {"id": 14, "exercise": 2, "theme": "Régression", "question": "La statistique de test évaluant le modèle de régression est environ égale à", "options": ["-14.1", "198.7", "-12.3", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "Le test global du modèle de régression utilise F = [r² / (1 − r²)] × (n − 2). Ici F(1,8) ≈ 198,72. Le test t de la pente donne −14,10 ; les deux tests sont équivalents, avec F = t²."}, {"id": 15, "exercise": 2, "theme": "Diagramme de dispersion", "question": "Le diagramme de dispersion montre que", "options": ["plus la glycémie augmente plus le seuil de sensibilité au froid augmente.", "Plus la glycémie augmente, plus le seuil de sensibilité au froid diminue.", "le seuil de sensibilité au froid ne varie pas avec la glycémie.", "Aucune des réponses ci-dessus ne convient."], "answer": 1, "explanation": "La relation est négative : plus la glycémie augmente, plus le seuil de sensibilité au froid diminue en valeur signée. Un refroidissement plus important est alors nécessaire pour percevoir le froid."}, {"id": 16, "exercise": 2, "theme": "Axes du diagramme", "question": "Une construction logique du diagramme de dispersion se fera", "options": ["avec la glycémie en abscisses et le seuil en ordonnées.", "avec le seuil en abscisses et la glycémie en ordonnées.", "indifféremment avec l'une ou l'autre variable sur l'un des deux axes.", "Aucune des réponses ci-dessus ne convient."], "answer": 0, "explanation": "Pour modéliser le seuil de sensibilité au froid en fonction de la glycémie, la glycémie est la variable explicative placée en abscisses et le seuil la variable dépendante placée en ordonnées."}, {"id": 17, "exercise": 2, "theme": "Erreur d’estimation", "question": "Lorsque la corrélation entre deux variables est nulle", "options": ["l’erreur standard d’estimation de la droite de régression est égale à l’écart-type de la variable dépendante.", "l’erreur standard d’estimation de la droite de régression est nulle.", "l’erreur standard d’estimation est égale à la racine carrée de l’écart-type de la variable dépendante.", "Aucune des réponses proposées convient."], "answer": 0, "explanation": "Lorsque r = 0, la droite ajustée prédit la moyenne de Y. Avec la convention descriptive s résiduel = sY × √(1 − r²), la dispersion résiduelle est égale à celle de Y. Si l’erreur standard est estimée avec la correction des degrés de liberté n − 2, elle vaut sY × √[(n − 1) / (n − 2)] lorsque sY utilise n − 1."}, {"id": 18, "exercise": 2, "theme": "Coefficient de corrélation", "question": "Le coefficient de corrélation R exprime", "options": ["la part de variabilité intra-groupe dans la variabilité totale.", "la part de variabilité inter-groupe dans la variabilité totale.", "l’interaction entre la variabilité inter-groupe et la variabilité totale.", "Aucune des réponses proposées convient."], "answer": 3, "explanation": "Le coefficient de corrélation R exprime la force du lien linéaire (et son sens pour le r de Pearson signé). La part de variance expliquée correspond à R², et non à R. Aucune des propositions A, B ou C ne convient."}, {"id": 19, "exercise": 2, "theme": "Conditions de l’ANOVA", "question": "L’application de l’ANOVA requiert que", "options": ["les observations soient indépendantes dans les groupes expérimentaux.", "la distribution des variances soit normale.", "la distribution des moyennes soit normale.", "Aucune des réponses proposées convient."], "answer": 0, "explanation": "Les observations provenant de personnes distinctes doivent être indépendantes. Dans un plan mixte, les mesures répétées d’une même personne sont dépendantes et cette dépendance doit être prise en compte. La normalité concerne les erreurs du modèle, pas une distribution des variances."}, {"id": 20, "exercise": 2, "theme": "Coefficient R²", "question": "Le coefficient R2", "options": ["a une signification différente selon qu’il est calculé avec les techniques de l’ANOVA ou de la Régression.", "a une signification identique pour la technique de l’ANOVA et la Régression.", "est compris entre -1 et 1.", "Aucune des réponses proposées convient."], "answer": 1, "explanation": "En ANOVA comme en régression, R² représente la proportion de variabilité totale expliquée par le modèle. Dans le modèle classique avec constante, R² = SC expliquée / SC totale = 1 − SC résiduelle / SC totale et se situe entre 0 et 1."}];
const cases={"1": {"summary": "Exercice 1 · Neuropathies diabétiques et sensibilité au froid.", "intro": "Dans une étude clinique sur les neuropathies diabétiques, des auteurs ont tenté de mettre en évidence une perte de la sensibilité au froid chez des patients diabétiques. Les auteurs ont réparti les patients en deux groupes d’âge (plus ou moins de 60 ans) et ont mesuré leur seuil de perception du froid sur le dos de la main et le visage. Les seuils de perception du froid, exprimés en différence par rapport à la température de peau, sont donnés en °C dans le tableau ci-dessous.", "caption": "Seuil de perception du froid (°C)", "headers": ["Main 1", "Main 2", "Main 3", "Main 4", "Main 5", "Visage 1", "Visage 2", "Visage 3", "Visage 4", "Visage 5"], "rows": [["Sujets sains", -0.4, -0.3, -0.5, -0.4, -0.5, -0.1, -0.2, -0.1, -0.2, -0.1], ["Patients < 60 ans", -0.7, -0.8, -0.9, -0.8, -0.7, -0.2, -0.2, -0.1, -0.2, -0.1], ["Patients > 60 ans", -1.1, -1.4, -1.3, -1, -1.2, -0.4, -0.3, -0.2, -0.3, -0.4]], "note": ""}, "2": {"summary": "Exercice 2 · Glycémie et sensibilité au froid.", "intro": "Les auteurs ont ensuite essayé de voir si l’indice de glycémie, un marqueur du diabète, présente un lien significatif avec la perte de sensibilité au froid. Les valeurs sont données dans le tableau ci-dessous.", "caption": "Seuil au froid et glycémie", "rows": [["Seuil froid (main)", -0.7, -0.8, -0.9, -0.6, -0.7, -1.1, -1.4, -1.3, -1, -1.2], ["Glycémie (g/l)", 1.2, 1.3, 1.6, 1, 1.1, 1.8, 2.1, 2, 1.7, 1.8]], "note": ""}};
let current=0;let answers=Array(questions.length).fill(null);let completed=false;
const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const letter=i=>'ABCD'[i];
function renderQuestion(focus=false){const q=questions[current];$('question-card').innerHTML=`<div class="qtop"><span>QUESTION ${q.id} / 20</span><span>Exercice ${q.exercise} · ${escape(q.theme)}</span></div><h2 id="question-title" tabindex="-1">${escape(q.question)}</h2><fieldset><legend>Choisissez une seule réponse</legend><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}><span class="letter">${letter(i)}</span><span class="option-text">${escape(o)}</span></label>`).join('')}</div></fieldset><button type="button" class="btn" id="clear-answer" style="margin-top:16px">Je ne sais pas / laisser sans réponse</button><div class="bottom"><button class="btn" id="prev" ${current===0?'disabled':''}>Précédente</button><button class="btn primary" id="next">${current===19?'Voir ma progression':'Question suivante'}</button></div>`;
$('question-card').querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{answers[current]=Number(r.value);$('message').textContent='';renderProgress();}));$('clear-answer').onclick=()=>{answers[current]=null;renderQuestion(true);};$('prev').onclick=()=>go(current-1);$('next').onclick=()=>{if(current<19)go(current+1);else{$('finish').scrollIntoView({behavior:'smooth',block:'center'});$('finish').focus();}};renderProgress();const c=cases[q.exercise];$('case-summary').textContent=c.summary;$('case-data').innerHTML=`<p>${escape(c.intro)}</p><div class="tablewrap"><table><caption>${escape(c.caption)}</caption><thead><tr><th scope="col">Groupe</th>${c.rows[0].slice(1).map((_,i)=>`<th scope="col">${c.headers?escape(c.headers[i]):i+1}</th>`).join('')}</tr></thead><tbody>${c.rows.map(row=>`<tr><th scope="row">${escape(row[0])}</th>${row.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>${escape(c.note)}</p>`;if(focus)$('question-title').focus({preventScroll:true});}
function renderProgress(){let n=answers.filter(a=>a!==null).length;$('answered').textContent=`${n} réponse${n>1?'s':''} sur 20`;$('bar').style.width=`${n/20*100}%`;document.querySelector('.progress').setAttribute('aria-valuenow',n);$('question-nav').innerHTML=questions.map((q,i)=>`<button class="navq ${answers[i]!==null?'done':''}" aria-current="${i===current}" aria-label="Question ${i+1}, ${answers[i]!==null?'répondue':'sans réponse'}" data-q="${i}">${i+1}</button>`).join('');$('question-nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.q)));}
function go(i){if(i<0||i>=20||completed)return;const changed=questions[i].exercise!==questions[current].exercise;current=i;renderQuestion(!changed);if(changed){$('statement-title').focus({preventScroll:true});$('statement-title').scrollIntoView({behavior:'smooth',block:'start'});}else{$('question-card').scrollIntoView({behavior:'smooth',block:'start'});}}
$('finish').onclick=()=>{completed=true;const score=answers.filter((a,i)=>a===questions[i].answer).length;$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<div class="card results-head"><div class="score">${score}<small> / 20</small></div><div><p class="eyebrow">Votre résultat</p><h2 id="results-title" tabindex="-1">${score===20?'Toutes les réponses sont correctes.':'Le corrigé pour comprendre vos réponses.'}</h2><p class="sub">${score} bonne${score>1?'s':''} réponse${score>1?'s':''} · ${Math.round(score/20*100)} % de réussite.</p><div class="result-actions"><button class="btn primary" id="retry">Recommencer le QCM</button><button class="btn" id="print">Imprimer le corrigé</button></div></div></div>${questions.map((q,i)=>`<article class="card review"><p class="tag ${answers[i]===q.answer?'':'wrong'}">Question ${q.id} · ${answers[i]===null?'Sans réponse':answers[i]===q.answer?'Bonne réponse':'À revoir'}</p><h3>${escape(q.question)}</h3><p class="answer-line">${answers[i]===null?'<strong>Vous avez laissé cette question sans réponse.</strong>':`<strong>Votre réponse ${letter(answers[i])} :</strong> ${escape(q.options[answers[i]])}`}</p>${answers[i]!==q.answer?`<p class="answer-line"><strong>Bonne réponse ${letter(q.answer)} :</strong> ${escape(q.options[q.answer])}</p>`:''}<p class="explain">${escape(q.explanation)}</p></article>`).join('')}`;$('retry').onclick=()=>{answers=Array(20).fill(null);current=0;completed=false;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('message').textContent='';renderQuestion(true);window.scrollTo({top:0,behavior:'smooth'});};$('print').onclick=()=>window.print();$('results-title').focus();window.scrollTo({top:0,behavior:'smooth'});};renderQuestion();
</script><script>window.QCM_RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxxBUVfyHRBsVf62bA85YS2ykNneWUYAQp3bptzkI8snQRos3BcQqgDmh1Kvv2aCD_9/exec";
/* Suivi facultatif des tentatives, indépendant de l’hébergeur du QCM. */
(() => {
  const endpoint = window.QCM_RESULTS_ENDPOINT;
  if (!endpoint) return;
  let startedAt;
  let studentAlias = '';
  const quizPanel = document.getElementById('quiz');
  const welcome = document.createElement('section');
  welcome.className = 'card';
  welcome.id = 'welcome';
  welcome.innerHTML = `<h2>Avant de commencer</h2><p>Saisissez votre prénom et l'initiale de votre nom</p>
    <form id="start-form"><label for="start-alias">Votre nom</label><br><input id="start-alias" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px">
    
    <button class="btn primary" type="submit">Commencer le QCM</button><p id="start-error" role="status"></p></form>`;
  quizPanel.before(welcome);
  quizPanel.classList.add('hidden');
  welcome.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = document.getElementById('start-alias');
    studentAlias = input.value.trim();
    if (studentAlias.length < 2 || /[\x00-\x1f\x7f]/.test(studentAlias)) { document.getElementById('start-error').textContent = 'Saisissez un nom valide (2 à 60 caractères).'; return; }
    startedAt = new Date().toISOString();
    welcome.classList.add('hidden');
    quizPanel.classList.remove('hidden');
    document.getElementById('statement-title').focus({preventScroll:true});
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const finish = document.getElementById('finish');
  finish.addEventListener('click', () => {
    if (!completed) return;
    const attempt = {
      version: 1,
      quizId: 'qcm3-v1',
      attemptId: crypto.randomUUID(),
      startedAt,
      finishedAt: new Date().toISOString(),
      answers: answers.map((value, index) => ({questionId: questions[index].id, answer: value})),
    };
    const section = document.createElement('section');
    section.className = 'card';
    section.setAttribute('aria-labelledby', 'tracking-title');
    section.innerHTML = `<h2 id="tracking-title">Envoyer mes réponses pour voir ma note</h2>
      <p>Pour suivre votre progression, utilisez le même nom à chaque tentative. </p>
      <form id="tracking-form"><label for="student-alias">Votre nom</label><br>
      <input id="student-alias" name="alias" type="text" required minlength="2" maxlength="60" autocomplete="off" style="width:100%;max-width:360px;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px">
      <div><button class="btn primary" type="submit">Envoyer mon résultat</button></div>
      <p id="tracking-status" role="status" aria-live="polite" style="margin-top:12px"></p></form>`;
    const resultPanel = document.getElementById('results');
    const correction = document.createElement('div');
    correction.className = 'hidden';
    correction.id = 'correction';
    while(resultPanel.firstChild) correction.appendChild(resultPanel.firstChild);
    resultPanel.append(section, correction);
    resultPanel.setAttribute('aria-labelledby', 'tracking-title');
    const omitted = answers.filter(a => a === null).length;
    const summary = document.createElement('p');
    summary.textContent = `${answers.length - omitted} réponse(s) renseignée(s), ${omitted} question(s) sans réponse. La note et le corrigé apparaîtront après l’envoi.`;
    section.querySelector('h2').after(summary);
    section.style.marginBottom = "24px";
    const form = section.querySelector('form');
    const status = section.querySelector('#tracking-status');
    const alias = section.querySelector('input');
    const button = section.querySelector('button');
    alias.value = studentAlias;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (alias.value.trim().length < 2) { status.textContent = 'Saisissez un nom d’au moins deux caractères.'; return; }
      button.disabled = true;
      alias.disabled = true;
      status.textContent = 'Envoi en cours…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=UTF-8'},
          body: JSON.stringify({...attempt, alias: alias.value.trim()}),
          signal: controller.signal,
          credentials: 'omit',
        });
        if (!response.ok) throw new Error('HTTP');
        const result = await response.json();
        if (result.ok !== true || result.attemptId !== attempt.attemptId) throw new Error('Unconfirmed');
        status.textContent = 'Votre résultat a bien été enregistré. Vous pouvez consulter le corrigé ci-dessous.';
        button.textContent = 'Résultat envoyé';
        correction.classList.remove('hidden');
        resultPanel.setAttribute('aria-labelledby', 'results-title');
        document.getElementById('results-title').focus();
      } catch (_) {
        status.textContent = 'L’enregistrement n’a pas pu être confirmé. La note et le corrigé restent masqués. Vous pouvez réessayer : cette tentative ne sera pas comptée deux fois.';
        button.disabled = false;
        alias.disabled = false;
        button.textContent = 'Réessayer l’envoi';
      } finally { clearTimeout(timeout); }
    });
    document.getElementById('tracking-title').setAttribute('tabindex', '-1');
    document.getElementById('tracking-title').focus();
    document.getElementById('retry').addEventListener('click', () => {
      quizPanel.classList.add('hidden');
      welcome.classList.remove('hidden');
      document.getElementById('start-alias').value = studentAlias;
      document.getElementById('start-alias').focus();
    });
  });
})();
</script></body></html>
